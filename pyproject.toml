[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "rl-countdown"
version = "0.1.0"
description = "A reproducible, reward-verifiable GRPO study on arithmetic Countdown problems."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
authors = [{ name = "Pablo Cuervo García" }]
dependencies = [
    "datasets==4.1.1",
    "huggingface-hub==0.35.1",
    "matplotlib>=3.10,<4",
    "numpy>=2.1,<3",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
gpu = [
    "torch==2.8.0+cu128; sys_platform == 'win32'",
    "torch==2.8.0+cu128; sys_platform == 'linux'",
    "transformers==4.56.2",
    "trl==0.23.1",
    "peft==0.17.1",
    "accelerate==1.10.1",
    "tokenizers==0.22.1",
]

[project.scripts]
rl-countdown = "rl_countdown.cli:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.14,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rl_countdown"]

[tool.uv]
default-groups = []

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
